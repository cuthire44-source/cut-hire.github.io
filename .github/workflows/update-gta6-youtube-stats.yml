name: Refresh GTA VI YouTube video details (YouTube Data API)

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours in UTC; scheduled runs may be delayed.
    - cron: '29 */3 * * *'

permissions:
  contents: write

concurrency:
  group: gta-vi-youtube-stats
  cancel-in-progress: false

jobs:
  update-youtube-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the current repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public GTA VI video stats and channel avatars
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_gta6_stats.py
      - name: Commit refreshed JSON and channel avatars if changed
        run: |
          git add -- assets/data/gta6-video-stats.json
          if [ -d assets/images/youtube-channel-avatars ]; then
            git add -A -- assets/images/youtube-channel-avatars/
          fi
          if git diff --cached --quiet; then
            echo 'Statistics have not changed.'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh GTA VI public video stats'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
