<script id="cnh-joinus-main-reel-parity">
/* Join Us: same player and 2–5s teaser logic as the main site's Watch Our Reel. */
(function () {
  'use strict';
  var oldCard = document.querySelector('#paths .cnh-reel-card');
  var wrapper = document.getElementById('vp-wrap');
  var screen = document.getElementById('vp-screen');
  var iframe = document.getElementById('vp-embed-iframe');
  var closeBtn = document.getElementById('vp-close');
  if (!oldCard || !wrapper || !screen || !iframe || !closeBtn) return;

  // Detach legacy Join Us player event listeners. The full video uses the
  // main-site YouTube iframe rather than the separate local MP4 player.
  var card = oldCard.cloneNode(true);
  oldCard.replaceWith(card);
  var video = card.querySelector('.cnh-reel-preview');
  if (!video) return;
  var src = video.getAttribute('data-reel-src');
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  var fineHover = window.matchMedia('(hover: hover) and (pointer: fine)');
  var mobileMode = window.matchMedia('(max-width: 900px) and (hover: none)');
  var loading = false, failed = false, active = false, requestNumber = 0;
  var lastFocus = null, oldBodyStyle = null, savedScrollY = 0;

  video.muted = true;
  video.defaultMuted = true;
  video.playsInline = true;
  video.setAttribute('muted', '');
  video.setAttribute('playsinline', '');

  function resetTime() {
    if (video.readyState < 1) return;
    var maxStart = Math.max(0, (video.duration || 5) - .3);
    try { video.currentTime = Math.min(2, maxStart); } catch (_) { }
  }
  function stopPreview() {
    active = false;
    ++requestNumber;
    video.pause();
    card.classList.remove('is-previewing');
    resetTime();
  }
  function playPreview() {
    if (!active || failed || wrapper.classList.contains('open')) return;
    var token = ++requestNumber;
    var result;
    try { result = video.play(); } catch (_) { result = null; }
    if (result && typeof result.then === 'function') {
      result.then(function () {
        if (active && token === requestNumber && !wrapper.classList.contains('open')) {
          card.classList.add('is-previewing');
        }
      }).catch(function () { card.classList.remove('is-previewing'); });
    } else if (!video.paused) {
      card.classList.add('is-previewing');
    }
  }
  function startPreview() {
    if (failed || reducedMotion.matches || document.hidden || wrapper.classList.contains('open')) return;
    active = true;
    if (!loading) {
      loading = true;
      video.src = src;
      video.preload = 'auto';
      video.load();
    }
    resetTime();
    playPreview();
  }
  video.addEventListener('loadedmetadata', function () { if (active) resetTime(); });
  video.addEventListener('playing', function () {
    if (active && !wrapper.classList.contains('open')) card.classList.add('is-previewing');
  });
  video.addEventListener('timeupdate', function () {
    if (active && video.currentTime >= 5) {
      resetTime();
      if (video.paused) playPreview();
    }
  });
  video.addEventListener('ended', function () { if (active) { resetTime(); playPreview(); } });
  video.addEventListener('error', function () { failed = true; stopPreview(); });

  card.addEventListener('mouseenter', function () { if (fineHover.matches) startPreview(); });
  card.addEventListener('mouseleave', function () { if (fineHover.matches) stopPreview(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) stopPreview(); });

  // Match index.html's mobile viewport autoplay without activating it on PC.
  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function (entries) {
      if (!mobileMode.matches) return;
      entries.forEach(function (entry) {
        if (entry.isIntersecting && entry.intersectionRatio >= .45) startPreview();
        else stopPreview();
      });
    }, { threshold: [0, .2, .45, .65] });
    observer.observe(card);
  }

  function openReel() {
    if (wrapper.classList.contains('open')) return;
    stopPreview();
    lastFocus = document.activeElement;
    savedScrollY = window.scrollY || window.pageYOffset || 0;
    oldBodyStyle = document.body.getAttribute('style');
    document.documentElement.classList.add('cnh-reel-player-open');
    document.body.classList.add('cnh-reel-player-open');
    document.body.style.position = 'fixed';
    document.body.style.top = (-savedScrollY) + 'px';
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
    screen.className = 'vp-screen landscape';
    wrapper.classList.add('open', 'youtube-active');
    wrapper.setAttribute('aria-hidden', 'false');
    iframe.src = 'https://www.youtube.com/embed/Ck74FknRVV8?autoplay=1&rel=0&playsinline=1&modestbranding=1';
    closeBtn.focus({ preventScroll: true });
  }
  function closeReel() {
    if (!wrapper.classList.contains('open')) return;
    iframe.removeAttribute('src');
    wrapper.classList.remove('open', 'youtube-active');
    wrapper.setAttribute('aria-hidden', 'true');
    document.documentElement.classList.remove('cnh-reel-player-open');
    document.body.classList.remove('cnh-reel-player-open');
    if (oldBodyStyle === null) document.body.removeAttribute('style');
    else document.body.setAttribute('style', oldBodyStyle);
    window.scrollTo(0, savedScrollY);
    if (lastFocus && typeof lastFocus.focus === 'function') {
      lastFocus.focus({ preventScroll: true });
    }
  }
  card.addEventListener('click', function (event) {
    event.preventDefault();
    event.stopImmediatePropagation();
    openReel();
  });
  card.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      event.stopImmediatePropagation();
      openReel();
    }
  });
  closeBtn.addEventListener('click', function (event) {
    event.preventDefault();
    event.stopImmediatePropagation();
    closeReel();
  }, true);
  wrapper.addEventListener('click', function (event) {
    if (event.target === wrapper) closeReel();
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && wrapper.classList.contains('open')) {
      event.preventDefault();
      event.stopImmediatePropagation();
      closeReel();
    }
  }, true);
  window.addEventListener('pagehide', function () {
    if (wrapper.classList.contains('open')) closeReel();
  });
})();
</script>
