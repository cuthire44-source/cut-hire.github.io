<style>
:root{
  --bg:#000000;
  --card:#050505;
  --red:#e02020;--rg:rgba(224,32,32,.55);--rs:rgba(224,32,32,.12);
  --blue:#3a7bd5;
  --w:#f5f0eb;--m:#5c5c5c;--b:rgba(255,255,255,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--w);font-family:'DM Sans',sans-serif;overflow-x:hidden;min-height:100vh}

body::before{content:'';position:fixed;inset:0;z-index:9000;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");opacity:.5}

 
.back-btn{position:fixed;top:1.4rem;left:2rem;z-index:500;display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--w);font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;padding:.5rem 1.3rem;border:1px solid rgba(224,32,32,.5);background:rgba(224,32,32,.12);backdrop-filter:blur(10px);transition:all .25s;animation:fade-in .3s .05s both}
.back-btn:hover{color:#fff;border-color:var(--red);background:rgba(224,32,32,.22);box-shadow:0 0 18px rgba(224,32,32,.25)}
.back-btn svg{transition:transform .25s}
.back-btn:hover svg{transform:translateX(-3px)}
@keyframes fade-in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}

 
.orb{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0}
.o1{width:600px;height:600px;background:rgba(224,32,32,.07);top:-10%;left:-15%}
.o2{width:500px;height:500px;background:rgba(58,123,213,.06);bottom:-10%;right:-10%}
.o3{width:350px;height:350px;background:rgba(224,32,32,.05);top:40%;right:5%}

 
.join-hero{min-height:38vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5rem 2rem 3rem;position:relative;z-index:1}
.join-eyebrow{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--red);margin-bottom:1.2rem;opacity:0;animation:fup .4s .05s forwards}
.join-h1{font-family:'Playfair Display',serif;font-size:clamp(3rem,7vw,6rem);font-weight:900;line-height:.95;letter-spacing:-.03em;opacity:0;animation:fup .4s .15s forwards}
.join-h1 em{font-style:italic;color:var(--red)}
.join-sub{max-width:540px;margin:1.4rem auto 0;color:var(--m);font-size:.9rem;line-height:1.9;opacity:0;animation:fup .4s .25s forwards}
@keyframes fup{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

 
.divider{width:100%;max-width:1200px;margin:0 auto;height:1px;background:linear-gradient(to right,transparent,rgba(224,32,32,.22),rgba(224,32,32,.5),rgba(224,32,32,.22),transparent)}

 
.join-content{max-width:1200px;margin:0 auto;padding:4rem 2rem 6rem;position:relative;z-index:1}

 
.paths{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-bottom:4rem;align-items:stretch}

@media(max-width:760px){.paths{grid-template-columns:1fr}.path-card{min-height:auto}.path-btn{width:100%;align-self:stretch;text-align:center}}

.path-card{
  background:var(--card);
  border:1px solid var(--b);
  padding:2.8rem 2.4rem;
  position:relative;
  overflow:hidden;
  transition:border-color .3s,transform .3s,opacity .7s;
  opacity:1;
  transform:none;
  min-height:560px;
  display:flex;
  flex-direction:column;
}
.path-card.pre-reveal{opacity:0;transform:translateY(30px)}
.path-card.pre-reveal.vis{opacity:1;transform:none}
.path-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .4s;pointer-events:none}
.path-card.client::before{background:radial-gradient(circle at 50% 110%,rgba(224,32,32,.07),transparent 65%)}
.path-card.editor::before{background:radial-gradient(circle at 50% 110%,rgba(58,123,213,.07),transparent 65%)}
.path-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;transform:scaleX(0);transition:transform .4s}
.path-card.client::after{background:var(--red)}
.path-card.editor::after{background:var(--blue)}
.path-card:hover{transform:translateY(-4px)}
.path-card.client:hover{border-color:rgba(224,32,32,.25)}
.path-card.editor:hover{border-color:rgba(58,123,213,.25)}
.path-card:hover::before{opacity:1}
.path-card:hover::after{transform:scaleX(1)}

.path-badge{display:inline-flex;align-items:center;gap:.45rem;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;padding:.28rem .75rem;border:1px solid;margin-bottom:1.4rem}
.path-badge.cl{color:var(--red);border-color:rgba(224,32,32,.28);background:rgba(224,32,32,.05)}
.path-badge.ed{color:var(--blue);border-color:rgba(58,123,213,.28);background:rgba(58,123,213,.05)}

.icon-img{
  display:inline-block;
  width:1em;
  height:1em;
  object-fit:contain;
  object-position:center;
  vertical-align:-0.12em;
  flex-shrink:0;
}

.badge-icon{
  width:.78rem;
  height:.78rem;
}

.path-icon{
  width:2.4rem;
  height:2.4rem;
  margin-bottom:1rem;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .4s;
}

.path-icon img{
  width:2.35rem;
  height:2.35rem;
  object-fit:contain;
  display:block;
}

.how-step-icon{
  width:1.2rem;
  height:1.2rem;
  margin-bottom:.55rem;
  display:flex;
  align-items:center;
  justify-content:center;
}

.how-step-icon img{
  width:1.15rem;
  height:1.15rem;
  object-fit:contain;
  display:block;
}

.ns-icon{
  width:.78rem;
  height:.78rem;
}

 
.icon-img,
.path-icon img,
.how-step-icon img{
  filter: brightness(0) invert(1);
}

 
img[src="film-reel.png"]{
  transform:scale(1.18);
  transform-origin:center;
}

.path-badge img[src="film-reel.png"]{
  width:.9rem;
  height:.9rem;
}

.path-icon img[src="film-reel.png"]{
  width:2.65rem;
  height:2.65rem;
}

.how-step-icon img[src="film-reel.png"]{
  width:1.35rem;
  height:1.35rem;
}

 
.path-badge.cl img[src="friend.png"]{
  width:.92rem;
  height:.92rem;
  object-fit:contain;
  transform:none !important;
}

.path-card:hover .path-icon{transform:scale(1.12) rotate(-4deg)}

.path-card h2{font-family:'Playfair Display',serif;font-size:clamp(1.5rem,3vw,2.2rem);font-weight:800;line-height:1.1;margin-bottom:.75rem}
.path-card.client h2 em{color:var(--red);font-style:italic}
.path-card.editor h2 em{color:var(--blue);font-style:italic}

.path-desc{color:var(--m);font-size:.87rem;line-height:1.9;margin-bottom:1.6rem}

.path-perks{list-style:none;margin-bottom:2rem;display:flex;flex-direction:column;gap:.55rem}
.path-perks li{font-size:.8rem;color:var(--m);display:flex;align-items:flex-start;gap:.6rem;line-height:1.7}
.path-perks li::before{content:'◆';font-size:.42rem;margin-top:.42rem;flex-shrink:0}
.path-card.client .path-perks li::before{color:var(--red)}
.path-card.editor .path-perks li::before{color:var(--blue)}

.btn-red{background:var(--red);color:#fff;border:none;padding:.85rem 2rem;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.88rem;cursor:pointer;text-decoration:none;display:inline-block;letter-spacing:.04em;position:relative;overflow:hidden;transition:box-shadow .25s,transform .15s}
.btn-red::before{content:'';position:absolute;inset:0;background:linear-gradient(to right,transparent,rgba(255,255,255,.12),transparent);transform:translateX(-100%);transition:transform .5s}
.btn-red:hover{box-shadow:0 0 28px var(--rg);transform:translateY(-2px)}
.btn-red:hover::before{transform:translateX(100%)}

.btn-blu{background:var(--blue);color:#fff;border:none;padding:.85rem 2rem;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.88rem;cursor:pointer;text-decoration:none;display:inline-block;letter-spacing:.04em;position:relative;overflow:hidden;transition:box-shadow .25s,transform .15s}
.btn-blu::before{content:'';position:absolute;inset:0;background:linear-gradient(to right,transparent,rgba(255,255,255,.12),transparent);transform:translateX(-100%);transition:transform .5s}
.btn-blu:hover{box-shadow:0 0 28px rgba(58,123,213,.55);transform:translateY(-2px)}
.btn-blu:hover::before{transform:translateX(100%)}

.path-btn{
  margin-top:auto;
  align-self:center;
  min-width:245px;
  text-align:center;
}

 
.how-strip{margin-bottom:4rem;transition:opacity .7s .1s,transform .7s .1s}
.strip-label{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--red);margin-bottom:1.6rem;display:inline-flex;align-items:center;gap:.5rem}
.strip-label::before{content:'';display:inline-block;width:14px;height:1px;background:var(--red)}
.how-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
@media(max-width:760px){.how-steps{grid-template-columns:repeat(2,1fr)}}
.how-step{background:var(--card);border:1px solid var(--b);padding:1.6rem 1.3rem;position:relative;overflow:hidden;transition:border-color .3s,transform .3s}
.how-step::before{content:'';position:absolute;top:0;left:0;right:0;height:0;background:linear-gradient(to bottom,var(--rs),transparent);transition:height .4s}
.how-step:hover{border-color:rgba(224,32,32,.2);transform:translateY(-2px)}
.how-step:hover::before{height:40px}
.how-num{font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:900;color:rgba(224,32,32,.35);line-height:1;margin-bottom:.5rem;transition:color .3s}
.how-step:hover .how-num{color:rgba(224,32,32,.55)}

.how-step h4{font-family:'Playfair Display',serif;font-size:.9rem;margin-bottom:.35rem;transition:color .3s}
.how-step:hover h4{color:var(--red)}
.how-step p{font-size:.72rem;color:var(--m);line-height:1.75}

 
.discord-strip{border:1px solid rgba(224,32,32,.15);padding:2.2rem 2.6rem;display:flex;align-items:center;justify-content:space-between;gap:2rem;flex-wrap:wrap;position:relative;overflow:hidden;transition:opacity .7s .2s,transform .7s .2s}
.discord-strip::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 0% 50%,rgba(224,32,32,.04),transparent 55%);pointer-events:none}
.discord-strip::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--red)}
.ds-text h3{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:800;margin-bottom:.3rem}
.ds-text h3 em{color:var(--red);font-style:italic}
.ds-text p{font-size:.78rem;color:var(--m);max-width:480px;line-height:1.8}
.disc-ticket{display:inline-flex;align-items:center;gap:.6rem;background:transparent;border:1px solid rgba(255,255,255,.08);padding:.6rem 1.3rem;font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--m);transition:border-color .3s,color .3s;margin-top:.8rem}
.disc-ticket:hover{border-color:rgba(224,32,32,.3);color:var(--w)}
.disc-ticket span{color:var(--red);animation:ab .8s ease-in-out infinite}
@keyframes ab{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}

 
.faq-section{margin-top:4rem;}
.faq-item{border-bottom:1px solid var(--b);padding:1.2rem 0;cursor:pointer}
.faq-q{display:flex;align-items:center;justify-content:space-between;font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--w);transition:color .25s}

@property --stroke-angle{
  syntax:"<angle>";
  inherits:false;
  initial-value:103.678deg;
}

@property --stroke-x{
  syntax:"<percentage>";
  inherits:false;
  initial-value:83.9783%;
}

.stroke-glow-btn{
  position:relative !important;
  isolation:isolate;
  overflow:hidden !important;

   
  border:2.8px solid rgba(0,0,0,.74) !important;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.16),
    inset 0 -2px 0 rgba(0,0,0,.38),
    0 0 0 1px rgba(255,255,255,.03),
    0 12px 28px rgba(0,0,0,.38) !important;

  transform:translateZ(0) scale(1);
  transform-origin:center;
  backface-visibility:hidden;

  transition:
    transform .46s cubic-bezier(.16,1,.3,1),
    filter .46s ease,
    box-shadow .46s ease !important;
}

 
.stroke-glow-btn::before,
.stroke-glow-btn::after{
  display:none !important;
  content:none !important;
}

 
.stroke-glow-btn > span:not(.stroke-spin-mask):not(.stroke-inner-gloss){
  position:relative;
  z-index:7;
}

 
.stroke-inner-gloss{
  position:absolute;
  inset:2px;
  border-radius:inherit;
  pointer-events:none;
  z-index:3;
  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.18) 0%,
      rgba(255,255,255,.07) 28%,
      rgba(255,255,255,0) 66%
    );
  opacity:.62;
}

 
.stroke-spin-mask{
  position:absolute;
  inset:-1px;
  z-index:6;
  pointer-events:none;
  border-radius:inherit;
  padding:2.8px;

  background:
    conic-gradient(
      from var(--stroke-angle) at var(--stroke-x) 50%,
      rgba(0,0,0,0) 309deg,
      rgba(255,255,255,.06) 313deg,
      rgba(255,255,255,.20) 319deg,
      rgba(245,245,245,.54) 328deg,
      rgba(255,255,255,.98) 335deg,
      rgba(245,245,245,.54) 342deg,
      rgba(255,255,255,.20) 349deg,
      rgba(255,255,255,.06) 354deg,
      rgba(0,0,0,0) 359deg
    ),
    linear-gradient(
      180deg,
      rgba(0,0,0,.48),
      rgba(0,0,0,.84)
    );

  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;

  animation:strokeSpin 5.55s linear infinite;
  will-change:background;
}

 
.stroke-spin-mask::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:
    conic-gradient(
      from var(--stroke-angle) at var(--stroke-x) 50%,
      rgba(0,0,0,0) 316deg,
      rgba(255,255,255,.08) 323deg,
      rgba(255,255,255,.26) 335deg,
      rgba(255,255,255,.08) 347deg,
      rgba(0,0,0,0) 354deg
    );
  filter:blur(.85px);
  opacity:.34;
}

@keyframes strokeSpin{
   
  0%{--stroke-angle:103.678deg;--stroke-x:83.9783%;}
  7%{--stroke-angle:123.411deg;--stroke-x:83.9783%;}

   
  14%{--stroke-angle:134.133deg;--stroke-x:77.0819%;}
  21%{--stroke-angle:154.99deg;--stroke-x:61.3336%;}
  28%{--stroke-angle:175.37deg;--stroke-x:45.9454%;}

  61%{--stroke-angle:310.93deg;--stroke-x:20.4992%;}
  68%{--stroke-angle:331.241deg;--stroke-x:35.8359%;}
  75%{--stroke-angle:351.621deg;--stroke-x:51.224%;}
  82%{--stroke-angle:372deg;--stroke-x:66.6%;}
  89%{--stroke-angle:392deg;--stroke-x:81.6%;}

   
  94%{--stroke-angle:412deg;--stroke-x:83.9783%;}
  100%{--stroke-angle:463.678deg;--stroke-x:83.9783%;}
}

<input aria-label="Volume" class="vp-vol" id="vp-vol" max="1" min="0" step="0.02" type="range" value="1"/>
</div>
<span class="vp-time" id="vp-time">0:00 / 0:00</span>
<span class="vp-spacer"></span>
<button aria-label="Fullscreen" class="vp-btn" id="vp-full" type="button"><img alt="Fullscreen" id="vp-fs-img" src="fullscreen.png"/></button>
</div>
</div>
</div>
<script>
window.addEventListener('load',()=>document.body.style.overflow='visible');


(function(){
  const visits = parseInt(localStorage.getItem('cnh_visits')||'0');

})();

window.addEventListener('load', () => {
  requestAnimationFrame(() => {
    document.body.classList.add('intro-visible');
  });
});


</script>
<script>
 
(function(){
  const HOME_SCROLL_KEY = 'cnh_home_scroll_y';
  const backBtn = document.querySelector('.back-btn');
  if(!backBtn) return;

  backBtn.addEventListener('click', function(e){
    e.preventDefault();
    let hasSavedSpot = false;
    try{ hasSavedSpot = sessionStorage.getItem(HOME_SCROLL_KEY) !== null; }catch(err){}


    if(hasSavedSpot && document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1){
      history.back();
      return;
    }
    
    window.location.href = '/';
  });
})();
</script>
<script>
 
(function(){
  const wrap=document.getElementById('vp-wrap');
  const screen=document.getElementById('vp-screen');
  const video=document.getElementById('vp-video');
  const closeBtn=document.getElementById('vp-close');
  const playBtn=document.getElementById('vp-play');
  const muteBtn=document.getElementById('vp-mute');
  const vol=document.getElementById('vp-vol');
  const timeline=document.getElementById('vp-timeline');
  const prog=document.getElementById('vp-tl-prog');
  const buf=document.getElementById('vp-tl-buf');
  const thumb=document.getElementById('vp-tl-thumb');
  const time=document.getElementById('vp-time');
  const full=document.getElementById('vp-full');
  const big=document.getElementById('vp-bigplay');
  const playImg=document.getElementById('vp-play-img');
  const volImg=document.getElementById('vp-vol-img');
  const fsImg=document.getElementById('vp-fs-img');
  if(!wrap||!video) return;

  const fmt=s=>{
    if(!Number.isFinite(s)) return '0:00';
    const m=Math.floor(s/60);
    const sec=Math.floor(s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  };

  function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement)}

  function update(){
    const d=video.duration||0;
    const p=d?(video.currentTime/d)*100:0;
    prog.style.width=p+'%';
    thumb.style.left=p+'%';
    time.textContent=`${fmt(video.currentTime)} / ${fmt(d)}`;
    if(playImg) playImg.src=video.paused?'play-buttton.png':'pause.png';
    if(volImg) volImg.src=(video.muted||video.volume===0)?'mute.png':'volume.png';
    if(fsImg) fsImg.src=isFS()?'unfullscreen.png':'fullscreen.png';

    try{
      if(video.buffered && video.buffered.length && d){
        const end=video.buffered.end(video.buffered.length-1);
        buf.style.width=Math.min(100,(end/d)*100)+'%';
      }
    }catch(e){}
  }

  function openVideo(src, poster, isPlaceholder, playerTheme){
    if(!isPlaceholder && !src) return;
    wrap.classList.remove('closing-neutral','placeholder-mode','placeholder-blue','placeholder-red','player-blue','player-red');
    wrap.classList.toggle('placeholder-mode', !!isPlaceholder);
    wrap.classList.toggle('placeholder-blue', !!isPlaceholder && playerTheme==='blue');
    wrap.classList.toggle('placeholder-red', !!isPlaceholder && playerTheme==='red');
    wrap.classList.toggle('player-blue', !isPlaceholder && playerTheme==='blue');
    wrap.classList.toggle('player-red', !isPlaceholder && playerTheme==='red');
    wrap.classList.add('open');
    wrap.setAttribute('aria-hidden','false');
    document.body.classList.add('video-modal-locked');
    video.volume=parseFloat(vol.value||'1');

    if(isPlaceholder){
      video.pause();
      video.removeAttribute('src');
      video.removeAttribute('poster');
      video.load();
      if(playImg) playImg.src='play-buttton.png';
      if(volImg) volImg.src='volume.png';
      if(fsImg) fsImg.src=isFS()?'unfullscreen.png':'fullscreen.png';
      prog.style.width='0%';
      thumb.style.left='0%';
      buf.style.width='0%';
      time.textContent='0:00 / 0:00';
      big.classList.add('show');
      return;
    }

    if(poster) video.setAttribute('poster', poster);
    else video.removeAttribute('poster');
    video.src=src;
    video.play().catch(()=>{});
    update();
  }

  function closeVideo(){
    if(isFS()){
      const exit=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
      if(exit) exit.call(document);
    }


    wrap.classList.add('closing-neutral');
    wrap.classList.remove('placeholder-mode','placeholder-blue','placeholder-red','player-blue','player-red','is-fullscreen');

    video.pause();
    video.removeAttribute('src');
    video.removeAttribute('poster');
    video.load();
    wrap.classList.remove('open');
    wrap.setAttribute('aria-hidden','true');
    document.body.classList.remove('video-modal-locked');
    update();

    window.setTimeout(()=>{
      wrap.classList.remove('closing-neutral');
    }, 380);
  }

  function toggleFS(){
    if(!isFS()){
      const req=wrap.requestFullscreen||wrap.webkitRequestFullscreen||wrap.msRequestFullscreen;
      if(req){
        const result=req.call(wrap);
        wrap.classList.add('is-fullscreen');
        if(result&&result.catch) result.catch(()=>{
          wrap.classList.remove('is-fullscreen');
          if(video.webkitEnterFullscreen) video.webkitEnterFullscreen();
        });
      }else if(video.webkitEnterFullscreen){
        video.webkitEnterFullscreen();
      }
    }else{
      const exit=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
      if(exit) exit.call(document);
      wrap.classList.remove('is-fullscreen');
    }
    update();
  }

  document.querySelectorAll('.join-video-card').forEach(card=>{
    const src=card.getAttribute('data-video-src');
    const poster=card.getAttribute('data-video-poster');
    const isPlaceholder=card.getAttribute('data-placeholder')==='true';
    const playerTheme=card.closest('.path-card.client')?'red':'blue';
    card.addEventListener('click',()=>openVideo(src, poster, isPlaceholder, playerTheme));
    card.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();openVideo(src, poster, isPlaceholder, playerTheme)}
    });
  });

  closeBtn.addEventListener('click',e=>{e.stopPropagation();closeVideo();});
  wrap.addEventListener('click',e=>{
    const inside=e.target.closest('.vp-screen')||e.target.closest('.vp-controls')||e.target.closest('.vp-close');
    if(!inside) closeVideo();
  });
  document.addEventListener('keydown',e=>{
    if(!wrap.classList.contains('open')) return;
    if(e.key==='Escape') closeVideo();
    if(e.key.toLowerCase()==='f') toggleFS();
    if(e.key===' ' && !wrap.classList.contains('placeholder-mode')) {e.preventDefault(); video.paused?video.play():video.pause();}
  });
  screen.addEventListener('click',e=>{ if(wrap.classList.contains('placeholder-mode')) return; if(!e.target.closest('.vp-btn')) video.paused?video.play():video.pause(); });
  playBtn.addEventListener('click',e=>{e.stopPropagation(); if(wrap.classList.contains('placeholder-mode')) return; video.paused?video.play():video.pause();});
  muteBtn.addEventListener('click',e=>{e.stopPropagation();video.muted=!video.muted;update();});
  vol.addEventListener('input',()=>{video.volume=parseFloat(vol.value);video.muted=video.volume===0;update();});
  timeline.addEventListener('click',e=>{
    const r=timeline.getBoundingClientRect();
    const pct=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    if(!wrap.classList.contains('placeholder-mode') && video.duration) video.currentTime=pct*video.duration;
  });
  full.addEventListener('click',e=>{e.stopPropagation();toggleFS();});
  ['timeupdate','loadedmetadata','progress','volumechange','play','pause','ended'].forEach(ev=>video.addEventListener(ev,update));
  video.addEventListener('play',()=>{big.classList.remove('show')});
  video.addEventListener('pause',()=>{big.classList.add('show')});
  ['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(ev=>document.addEventListener(ev,()=>{
    wrap.classList.toggle('is-fullscreen',isFS());
    update();
  }));
})();

(function(){
  function fixRequestedText(){
    var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
    var node;
    while((node=walker.nextNode())){
      node.nodeValue=node.nodeValue
        .replace(/For Clients/g,'For Outreachers')
        .replace(/Ready to Get Real Clients\?/g,'Ready to land real clients?')
        .replace(/Ready to get Real Clients\?/g,'Ready to land real clients?')
        .replace(/Need an Editor\?/g,'Ready to land real clients?');
    }
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',fixRequestedText);
  }else{
    fixRequestedText();
  }
})();
</script>
</body>
</html>
